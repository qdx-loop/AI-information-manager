/*
 * 应用模块构建脚本（已手工改写，不再是 bubblewrap 生成的原样文件）。
 *
 * 与原始 bubblewrap 工程的区别（改动前请读 apk-build/README.md）：
 *   - 唯一 Activity 是 MainActivity（纯 WebView 壳），TWA 的 LauncherActivity /
 *     DelegationService 与 androidbrowserhelper 依赖已删除；
 *   - bubblewrap 的 twa-manifest 映射块、generateShorcutsFile 任务、androidx.browser 版本锁定全部删掉，
 *     颜色/主题改由 res/values/styles.xml 与 MainActivity 决定；
 *   - compileSdk / targetSdk = 36：Google Play 自 2026-08-31 起要求新应用与更新必须 target API 36。
 */
plugins {
    id 'com.android.application'
}

/*
 * 站点地址与「是否允许明文流量」可被命令行属性覆盖，默认是生产值：
 *   出测试包（指向本机开发服务器）：./gradlew assembleRelease -PlaunchUrl=http://10.0.2.2:5199 -Pcleartext=true
 * （10.0.2.2 是安卓模拟器访问宿主机 localhost 的固定地址）
 */
def shellLaunchUrl = (project.findProperty('launchUrl') ?: 'https://aiim.de5.net').toString()
def shellCleartext = (project.findProperty('cleartext') ?: 'false').toString()

android {
    namespace "net.aiim.infodesk"
    compileSdk 36

    defaultConfig {
        applicationId "net.aiim.infodesk"
        // minSdk 24：构建产物是 ES2020（?. / ??），需要 WebView >= 80，
        // Android 5/6 的存量 WebView 版本无法保证，装上也只会白屏。
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 7
        versionName "1.2.1"
        resValue "string", "appName", "信息管理 · AI 助手"
        resValue "string", "launchUrl", shellLaunchUrl
        manifestPlaceholders = [usesCleartextTraffic: shellCleartext]
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
    }
}

configurations.all {
    /*
     * Kotlin 1.8 起 kotlin-stdlib-jdk7/jdk8 的内容已并入 kotlin-stdlib（二者只剩空壳），
     * 但 kotlinx-coroutines-android:1.6.4（经 lifecycle 2.6.2 ← androidx.activity 拖进来）
     * 仍声明 jdk8:1.6.21，与 androidx 侧的 kotlin-stdlib:1.8.22 撞出「重复类」构建失败。
     * 直接排除这两个空壳：所需类由 kotlin-stdlib 提供，且不必再从远端拉 1.8.22 的空包。
     */
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // 返回键用 OnBackPressedDispatcher（targetSdk 36 在 Android 16 上不再调用 onBackPressed），
    // inset 用 androidx.core 的 WindowInsetsCompat（Android 15+ 强制 edge-to-edge）
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.13.1'
}
