/*
 * 顶层构建脚本（已手工改写：去掉早已关停的 jcenter() 仓库）。
 * AGP 仍锁在 8.9.1（bubblewrap 自带、本机缓存里有的版本），
 * compileSdk 36 比它「认识的」新一档，靠 gradle.properties 的
 * android.suppressUnsupportedCompileSdk=36 放行；换 AGP 需要同时升级 Gradle wrapper。
 */
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
